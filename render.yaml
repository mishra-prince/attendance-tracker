services:
  - type: web
    name: threshold-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    rootDir: server
    healthCheckPath: /ready
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BLE_BEACON_SECRET
        generateValue: true
      - key: RFID_CARD_HASH_SECRET
        generateValue: true
      - key: ATTENDANCE_TIMEZONE
        value: Asia/Kolkata
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: CLIENT_URL
        value: https://localhost,capacitor://localhost
      - key: ALLOW_DEMO_SEED
        value: 'false'
